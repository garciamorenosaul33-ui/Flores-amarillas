<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas 🌻</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}
body{
    background:linear-gradient(180deg,#08111f,#10253b 55%,#172d3b);
    color:white;
}
.container{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}
h1{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:700px;
    text-align:center;
    font-size:clamp(20px,4vw,34px);
    line-height:1.3;
    color:#fff8cf;
    text-shadow:0 0 8px rgba(255,215,60,.5),
                0 0 20px rgba(255,190,40,.3);
    z-index:100;
    animation:aparecer 2s ease;
}
.flower-container{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
.flower{
    position:absolute;
    bottom:-30px;
    width:100px;
    height:180px;
    transform-origin:bottom center;
    animation:crecer 2s ease-out forwards,
              balanceo 4s ease-in-out infinite;
    opacity:0;
}
.stem{
    position:absolute;
    width:6px;
    height:130px;
    background:linear-gradient(90deg,#285b24,#4f9d35,#285b24);
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
}
.leaf{
    position:absolute;
    width:55px;
    height:25px;
    background:linear-gradient(135deg,#4f9d35,#234d21);
    border-radius:100% 0 100% 0;
}
.leaf.left{
    left:5px;
    bottom:45px;
    transform:rotate(-30deg);
}
.leaf.right{
    right:5px;
    bottom:75px;
    transform:rotate(210deg);
}
.center{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:radial-gradient(circle,#6b3b00,#8d5100 45%,#4b2900);
    left:50%;
    top:20px;
    transform:translateX(-50%);
    z-index:3;
}
.petal{
    position:absolute;
    width:28px;
    height:65px;
    background:linear-gradient(180deg,#fff45c,#ffc400);
    border-radius:50%;
    left:50%;
    top:10px;
    transform-origin:50% 100%;
    z-index:2;
    box-shadow:0 0 8px rgba(255,208,0,.35);
}
.petal:nth-child(1){transform:translateX(-50%) rotate(0deg) translateY(-27px)}
.petal:nth-child(2){transform:translateX(-50%) rotate(45deg) translateY(-27px)}
.petal:nth-child(3){transform:translateX(-50%) rotate(90deg) translateY(-27px)}
.petal:nth-child(4){transform:translateX(-50%) rotate(135deg) translateY(-27px)}
.petal:nth-child(5){transform:translateX(-50%) rotate(180deg) translateY(-27px)}
.petal:nth-child(6){transform:translateX(-50%) rotate(225deg) translateY(-27px)}
.petal:nth-child(7){transform:translateX(-50%) rotate(270deg) translateY(-27px)}
.petal:nth-child(8){transform:translateX(-50%) rotate(315deg) translateY(-27px)}
.luz{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff8c4;
    border-radius:50%;
    animation:parpadear 3s infinite alternate;
}
@keyframes crecer{
    0%{
        transform:scale(0) translateY(100px);
        opacity:0;
    }
    100%{
        transform:scale(1) translateY(0);
        opacity:1;
    }
}
@keyframes balanceo{
    0%,100%{margin-left:0}
    50%{margin-left:8px}
}
@keyframes aparecer{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}
@keyframes parpadear{
    from{opacity:.2}
    to{
        opacity:1;
        transform:scale(1.8);
    }
}
@media(max-width:600px){
    h1{
        top:25px;
        font-size:21px;
        width:88%;
    }
}
</style>
</head>
<body>
<div class="container">
<h1>
Bonito día,<br>
tal vez no sean reales,<br>
pero no te quedas sin tus flores amarillas 🌻
</h1>
<div class="flower-container"></div>
</div>
<script>
const container =
document.querySelector(".flower-container");
function crearFlor(posicion,retraso,tamano){
    const flower =
    document.createElement("div");
    flower.className="flower";
    flower.style.left =
    posicion+"%";
    flower.style.animationDelay =
    retraso+"s";
    flower.style.scale =
    tamano;
    const stem =
    document.createElement("div");
    stem.className="stem";
    flower.appendChild(stem);
    const hojaIzq =
    document.createElement("div");
    hojaIzq.className="leaf left";
    flower.appendChild(hojaIzq);
    const hojaDer =
    document.createElement("div");
    hojaDer.className="leaf right";
    flower.appendChild(hojaDer);
    for(let i=0;i<8;i++){
        const petal =
        document.createElement("div");
        petal.className="petal";
        flower.appendChild(petal);
    }
    const center =
    document.createElement("div");
    center.className="center";
    flower.appendChild(center);
    container.appendChild(flower);
}
/* FLORES */
crearFlor(8,.2,.75);
crearFlor(18,.7,.95);
crearFlor(30,1.2,.8);
crearFlor(42,.4,1.1);
crearFlor(53,1.5,.9);
crearFlor(65,.9,1.15);
crearFlor(77,1.7,.8);
crearFlor(88,.5,1);
/* LUCES */
for(let i=0;i<35;i++){
    const luz =
    document.createElement("div");
    luz.className="luz";
    luz.style.left =
    Math.random()*100+"%";
    luz.style.top =
    Math.random()*70+"%";
    luz.style.animationDelay =
    Math.random()*3+"s";
    container.appendChild(luz);
}
</script>
</body>
</html>
