<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores Amarillas 🌻</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 100%,#173b2d 0%,#07151f 45%,#02070d 100%);
    color:white;
}

.container{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:25px;
    overflow:hidden;
}

h1{
    position:relative;
    z-index:10;
    max-width:800px;
    margin:0 0 25px;
    text-align:center;
    font-size:clamp(24px,5vw,48px);
    line-height:1.25;
    color:#fff8c7;
    text-shadow:
        0 0 8px #ffd92f,
        0 0 20px rgba(255,210,30,.6);
}

.flower-container{
    position:relative;
    width:100%;
    max-width:900px;
    height:420px;
}

.flower{
    position:absolute;
    bottom:20px;
    width:100px;
    height:260px;
    transform-origin:bottom center;
    animation:crecer 1.5s ease-out forwards;
}

@keyframes crecer{
    0%{
        transform:scale(0) translateY(100px);
        opacity:0;
    }
    100%{
        transform:scale(var(--s)) translateY(0);
        opacity:1;
    }
}

.stem{
    position:absolute;
    left:47px;
    bottom:0;
    width:7px;
    height:190px;
    border-radius:10px;
    background:linear-gradient(to right,#1b6b35,#48a447,#15572c);
}

.leaf{
    position:absolute;
    width:55px;
    height:25px;
    background:linear-gradient(135deg,#2e8b3c,#7acb4b);
    border-radius:100% 0 100% 0;
}

.leaf.left{
    left:0;
    bottom:75px;
    transform:rotate(-25deg);
}

.leaf.right{
    right:-2px;
    bottom:115px;
    transform:rotate(205deg);
}

.flower-head{
    position:absolute;
    top:0;
    left:0;
    width:100px;
    height:100px;
}

.petal{
    position:absolute;
    left:35px;
    top:2px;
    width:30px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(to bottom,#fff52c,#ffbd00);
    transform-origin:15px 48px;
    box-shadow:0 0 12px rgba(255,220,0,.7);
}

.p1{transform:rotate(0deg)}
.p2{transform:rotate(45deg)}
.p3{transform:rotate(90deg)}
.p4{transform:rotate(135deg)}
.p5{transform:rotate(180deg)}
.p6{transform:rotate(225deg)}
.p7{transform:rotate(270deg)}
.p8{transform:rotate(315deg)}

.center{
    position:absolute;
    left:31px;
    top:31px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:radial-gradient(circle,#9b5700,#552900);
    box-shadow:0 0 10px rgba(255,180,0,.5);
    z-index:2;
}

.light{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff5a8;
    box-shadow:0 0 8px #fff36a;
    animation:brillar 3s infinite ease-in-out;
}

@keyframes brillar{
    0%,100%{
        opacity:.1;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

@media(max-width:600px){
    .flower-container{
        height:330px;
    }

    .flower{
        transform-origin:bottom center;
    }

    .flower:nth-child(n+6){
        display:none;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>
Bonito día,<br>
tal vez no sean reales,<br>
pero no te quedas sin tus flores amarillas 🌻
</h1>

<div class="flower-container" id="flowers"></div>

</div>

<script>

const container=document.getElementById("flowers");

for(let i=0;i<8;i++){

    const flower=document.createElement("div");

    flower.className="flower";

    const posiciones=[
        {x:"5%",s:.65},
        {x:"17%",s:.85},
        {x:"29%",s:1},
        {x:"42%",s:.8},
        {x:"55%",s:1.05},
        {x:"68%",s:.82},
        {x:"80%",s:.95},
        {x:"91%",s:.65}
    ];

    const p=posiciones[i];

    flower.style.left=p.x;

    flower.style.setProperty("--s",p.s);

    flower.style.animationDelay=(i*.18)+"s";

    flower.innerHTML=`
        <div class="flower-head">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>
            <div class="center"></div>
        </div>

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>
    `;

    container.appendChild(flower);
}


// Luces flotando

for(let i=0;i<35;i++){

    const light=document.createElement("div");

    light.className="light";

    light.style.left=Math.random()*100+"%";
    light.style.top=Math.random()*100+"%";

    light.style.animationDelay=(Math.random()*3)+"s";

    light.style.animationDuration=(2+Math.random()*3)+"s";

    container.appendChild(light);
}

</script>

</body>
</html>
